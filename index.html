<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        function isBenignViteNotice(arg) {
          if (!arg) return false;
          const str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.includes('[vite]') || (str.includes('WebSocket') && str.includes('vite'));
        }
        console.error = function(...args) {
          if (args.some(isBenignViteNotice)) return;
          return origError.apply(console, args);
        };
        console.warn = function(...args) {
          if (args.some(isBenignViteNotice)) return;
          return origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (isBenignViteNotice(e.message) || isBenignViteNotice(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isBenignViteNotice(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
